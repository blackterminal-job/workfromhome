<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>Admin Panel | BlackTerminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --admin-red: #ff3b30;
      --bg: #020617;
      --surface: #0f172a;
      --accent: #38bdf8;
      --gold: #ffcc00;
      --success: #34c759;
      --bonus: #ff9500;
      --warning: #ffcc00;
      --text-muted: #94a3b8;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg); color: #f1f5f9; padding: 12px;
      padding-bottom: 50px; line-height: 1.4;
    }

    .admin-nav {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(2, 6, 23, 0.9));
      backdrop-filter: blur(15px); padding: 18px; border-radius: 24px;
      border: 1px solid rgba(255, 59, 48, 0.2); margin-bottom: 15px; text-align: center;
    }

    .grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }

    .card {
      background: var(--surface); border-radius: 22px; padding: 18px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    h2 { font-size: 15px; font-weight: 800; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }

    .table-wrapper { overflow-x: auto; margin: 0 -5px; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 450px; }
    th { text-align: left; font-size: 10px; color: var(--text-muted); padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    td { padding: 10px 8px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.02); }

    label { font-size: 9px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; display: block; margin: 10px 0 5px; }
    input, textarea, select {
      width: 100%; background: #020617; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 12px; color: white; font-family: inherit; font-size: 13px; outline: none;
    }
    
    .status-dropdown { padding: 6px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 10px; width: auto; }

    .push-btn { color: white; border: none; padding: 14px; border-radius: 12px; width: 100%; font-weight: 800; font-size: 13px; cursor: pointer; margin-top: 12px; transition: 0.2s; }
    .push-btn:active { transform: scale(0.97); }

    .upi-tag { background: rgba(56,189,248,0.1); color: var(--accent); padding: 4px 6px; border-radius: 6px; font-family: monospace; font-size: 11px; }
    .wa-btn { text-decoration: none; font-size: 18px; }
  </style>
</head>
<body>

  <div class="admin-nav">
    <span style="background:var(--admin-red); color:white; padding:4px 10px; border-radius:6px; font-size:9px; font-weight:800;">COMMANDER</span>
    <h1 style="margin: 5px 0 0; font-size: 18px;">BlackTerminal Admin</h1>
  </div>

  <div class="grid">
    
    <div class="card" style="border-color: var(--purple);">
      <h2 style="color: var(--purple);">⚙️ App Live Controls</h2>
      <label>Marquee Notice Text</label>
      <input type="text" id="mText" placeholder="Welcome to BlackTerminal!">
      
      <label>Marquee Speed (1=Very Slow, 10=Fast)</label>
      <input type="number" id="mSpeed" placeholder="Recommended: 5">

      <label>Custom Payout Message (For Popup)</label>
      <input type="text" id="pMsg" placeholder="Rahul just withdrew ₹150">

      <label>Popup Status</label>
      <select id="pStatus">
        <option value="on">Show Popups (ON)</option>
        <option value="off">Hide Popups (OFF)</option>
      </select>
      <button class="push-btn" style="background: var(--purple);" onclick="saveGeneral()">UPDATE LIVE APP</button>
    </div>

    <div class="card">
      <h2 style="color: var(--success);">💸 Withdrawals</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>UPI & Chat</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="withdrawTable">
            <tr><td colspan="4" style="text-align:center">Loading Payouts...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2 style="color: var(--accent);">📡 Daily Mission</h2>
      <label>Task Title</label>
      <input type="text" id="tName" placeholder="Post Status">
      <label>Reward (₹)</label>
      <input type="number" id="tReward" step="0.01" placeholder="1.50">
      <label>Steps</label>
      <textarea id="tSteps" rows="3"></textarea>
      <button class="push-btn" style="background: var(--accent);" onclick="saveTask()">UPDATE TASK</button>
    </div>

    <div class="card">
      <h2 style="color: var(--bonus);">🎁 Bonus Mission</h2>
      <label>Mission Name</label>
      <input type="text" id="bName" placeholder="Referral Bonus">
      <label>Bonus (₹)</label>
      <input type="number" id="bAmount" placeholder="500">
      <label>Unlock After (Tasks)</label>
      <input type="number" id="bLockCount" placeholder="5">
      <button class="push-btn" style="background: var(--bonus);" onclick="saveBonus()">UPDATE BONUS</button>
    </div>

    <div class="card">
      <h2 style="color: var(--gold);">🏆 Rank Control</h2>
      <input type="text" id="l1" style="margin-bottom:8px" placeholder="Rank 1">
      <input type="text" id="l2" style="margin-bottom:8px" placeholder="Rank 2">
      <input type="text" id="l3" placeholder="Rank 3">
      <button class="push-btn" style="background: var(--gold); color: #000;" onclick="saveLeaderboard()">UPDATE HALL OF FAME</button>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, onSnapshot, query, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3JnXAzxRGcoEgH4pO2ecAREYZrio_nZ8",
      authDomain: "nice-job-f79de.firebaseapp.com",
      projectId: "nice-job-f79de",
      storageBucket: "nice-job-f79de.firebasestorage.app",
      messagingSenderId: "116477324256",
      appId: "1:116477324256:web:4e9bee3627eb9f416d5985"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- SAVE GENERAL SETTINGS (MARQUEE & POPUP) ---
    window.saveGeneral = async () => {
      const notice = document.getElementById('mText').value;
      const speed = document.getElementById('mSpeed').value || 5;
      const popupMessage = document.getElementById('pMsg').value;
      const popupStatus = document.getElementById('pStatus').value;

      await setDoc(doc(db, "settings", "general"), {
        notice,
        speed: parseInt(speed),
        popupMessage,
        popupStatus,
        updatedAt: new Date()
      });
      alert("Live App Controls Updated!");
    };

    // --- WITHDRAWAL LOGIC ---
    onSnapshot(query(collection(db, "withdrawals"), orderBy("date", "desc")), (snap) => {
      const tbody = document.getElementById('withdrawTable');
      tbody.innerHTML = "";
      snap.forEach(d => {
        const w = d.data();
        const id = d.id;
        let statusColor = w.status === 'paid' ? "#34c759" : (w.status === 'not paid' ? "#ff3b30" : "#ffcc00");

        tbody.innerHTML += `
          <tr>
            <td><b>${w.name}</b></td>
            <td><span class="upi-tag">${w.upi}</span> <a href="https://wa.me/?text=Confirm UPI: ${w.upi}" target="_blank" class="wa-btn">🟢</a></td>
            <td>₹${w.amount}</td>
            <td>
              <select class="status-dropdown" style="color:${statusColor}" onchange="updateStatus('${id}', this.value)">
                <option value="pending" ${w.status === 'pending' ? 'selected' : ''}>PENDING</option>
                <option value="paid" ${w.status === 'paid' ? 'selected' : ''}>PAID</option>
                <option value="not paid" ${w.status === 'not paid' ? 'selected' : ''}>REJECT</option>
              </select>
            </td>
          </tr>`;
      });
    });

    window.updateStatus = async (id, s) => { await updateDoc(doc(db, "withdrawals", id), { status: s }); };

    // --- MISSION & RANK SAVE FUNCTIONS ---
    window.saveTask = async () => {
      const steps = document.getElementById('tSteps').value.split('\n');
      await setDoc(doc(db, "settings", "dailyTask"), { 
        name: document.getElementById('tName').value, 
        reward: parseFloat(document.getElementById('tReward').value), 
        steps 
      });
      alert("Daily Task Updated!");
    };

    window.saveBonus = async () => {
      await setDoc(doc(db, "settings", "bonusReward"), { 
        name: document.getElementById('bName').value, 
        amount: parseFloat(document.getElementById('bAmount').value), 
        lockCount: parseInt(document.getElementById('bLockCount').value) 
      });
      alert("Bonus Mission Updated!");
    };

    window.saveLeaderboard = async () => {
      const ranks = [document.getElementById('l1').value, document.getElementById('l2').value, document.getElementById('l3').value];
      await setDoc(doc(db, "settings", "leaderboard"), { ranks });
      alert("Leaderboard Updated!");
    };
  </script>
</body>
</html>
