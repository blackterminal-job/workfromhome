<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>Admin Command Center | BlackTerminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --admin-red: #ff3b30;
      --admin-glow: rgba(255, 59, 48, 0.3);
      --bg: #020617;
      --surface: #0f172a;
      --accent: #38bdf8;
      --gold: #ffcc00;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: #f1f5f9;
      padding: 20px;
      padding-bottom: 50px;
    }

    /* --- HEADER --- */
    .admin-nav {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(15px);
      padding: 25px;
      border-radius: 28px;
      border: 1px solid rgba(255, 59, 48, 0.2);
      margin-bottom: 30px;
      text-align: center;
    }
    .badge {
      background: var(--admin-red);
      color: white;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* --- BENTO GRID --- */
    .grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
    @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }

    .card {
      background: var(--surface);
      border-radius: 30px;
      padding: 25px;
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }

    h2 { font-size: 18px; font-weight: 800; margin-top: 0; display: flex; align-items: center; gap: 10px; color: #fff; }
    .card.task-card h2 { color: var(--accent); }
    .card.leader-card h2 { color: var(--gold); }
    .card.bonus-card h2 { color: #ff9500; }

    /* --- FORM ELEMENTS --- */
    label { font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; display: block; margin-top: 15px; }
    
    input, textarea {
      width: 100%;
      background: #020617;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 15px;
      color: white;
      font-family: inherit;
      font-weight: 600;
      box-sizing: border-box;
    }
    input:focus { border-color: var(--admin-red); outline: none; }

    .push-btn {
      background: var(--admin-red);
      color: white;
      border: none;
      padding: 18px;
      border-radius: 20px;
      width: 100%;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .push-btn:active { transform: scale(0.96); }

    .status-footer {
      margin-top: 40px;
      text-align: center;
      font-size: 11px;
      color: #475569;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="admin-nav">
    <span class="badge">System Admin</span>
    <h1 style="margin: 10px 0 0; font-size: 24px; font-weight: 800;">Command Center</h1>
  </div>

  <div class="grid">
    
    <div class="card task-card">
      <h2>📡 Daily Mission</h2>
      
      <label>Task Title</label>
      <input type="text" id="tName" placeholder="e.g. Share Poster on Status">
      
      <label>Reward Amount (₹)</label>
      <input type="number" id="tReward" step="0.01" placeholder="0.50">

      <label>Steps (One per line)</label>
      <textarea id="tSteps" rows="4" placeholder="Step 1&#10;Step 2&#10;Step 3"></textarea>

      <button class="push-btn" style="background: var(--accent);" onclick="saveTask()">UPDATE DAILY TASK</button>
    </div>

    <div class="card bonus-card">
      <h2>🎁 Bonus Reward</h2>
      
      <label>Bonus Task Name</label>
      <input type="text" id="bName" placeholder="e.g. Bring 1 Admission">
      
      <label>Bonus Amount (₹)</label>
      <input type="number" id="bAmount" placeholder="500">

      <label>Tasks Needed to Unlock</label>
      <input type="number" id="bLockCount" placeholder="2">

      <button class="push-btn" style="background: #ff9500;" onclick="saveBonus()">UPDATE BONUS MISSION</button>
    </div>

    <div class="card leader-card">
      <h2>🏆 Hall of Fame</h2>
      
      <label>Rank #1 (Format: Name - ₹Amount)</label>
      <input type="text" id="l1" placeholder="Rahul - ₹4,200">
      
      <label>Rank #2</label>
      <input type="text" id="l2" placeholder="Sana - ₹3,100">

      <label>Rank #3</label>
      <input type="text" id="l3" placeholder="Arjun - ₹2,500">

      <button class="push-btn" style="background: var(--gold); color: #000;" onclick="saveLeaderboard()">UPDATE RANKINGS</button>
    </div>

  </div>

  <div class="status-footer">
    SECURE FIREBASE CONNECTION ACTIVE ● NICE-JOB-F79DE
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3JnXAzxRGcoEgH4pO2ecAREYZrio_nZ8",
      authDomain: "nice-job-f79de.firebaseapp.com",
      projectId: "nice-job-f79de",
      storageBucket: "nice-job-f79de.firebasestorage.app",
      messagingSenderId: "116477324256",
      appId: "1:116477324256:web:4e9bee3627eb9f416d5985"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Save Daily Task
    window.saveTask = async () => {
      const name = document.getElementById('tName').value;
      const reward = document.getElementById('tReward').value;
      const steps = document.getElementById('tSteps').value.split('\n').filter(s => s.trim() !== "");

      if(!name || !reward) return alert("Please fill Task details");

      try {
        await setDoc(doc(db, "settings", "dailyTask"), {
          name,
          reward: parseFloat(reward),
          steps,
          updatedAt: new Date()
        });
        alert("Daily Task updated successfully!");
      } catch (e) { alert("Error: " + e.message); }
    };

    // Save Bonus Reward
    window.saveBonus = async () => {
      const name = document.getElementById('bName').value;
      const amount = document.getElementById('bAmount').value;
      const lockCount = document.getElementById('bLockCount').value;

      if(!name || !amount) return alert("Please fill Bonus details");

      try {
        await setDoc(doc(db, "settings", "bonusReward"), {
          name,
          amount: parseFloat(amount),
          lockCount: parseInt(lockCount),
          updatedAt: new Date()
        });
        alert("Bonus Mission updated successfully!");
      } catch (e) { alert("Error: " + e.message); }
    };

    // Save Leaderboard
    window.saveLeaderboard = async () => {
      const ranks = [
        document.getElementById('l1').value || "User - ₹0",
        document.getElementById('l2').value || "User - ₹0",
        document.getElementById('l3').value || "User - ₹0"
      ];

      try {
        await setDoc(doc(db, "settings", "leaderboard"), { ranks });
        alert("Leaderboard updated successfully!");
      } catch (e) { alert("Error: " + e.message); }
    };
  </script>
</body>
</html>
