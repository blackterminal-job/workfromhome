<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>My Profile | BlackTerminal</title>
  <style>
    :root {
      --accent: #007aff;
      --success: #34c759;
      --warning: #ffcc00;
      --dark-bg: #050a12;
      --card-bg: #111827;
      --text-muted: #94a3b8;
      --glass: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--dark-bg); color: #fff; padding-bottom: 100px; }

    /* --- HEADER --- */
    .profile-header {
      background: radial-gradient(circle at top right, #1e293b, #050a12);
      padding: 60px 20px 80px; text-align: center; position: relative; border-bottom: 1px solid var(--glass);
    }
    .avatar-container { position: relative; width: 110px; height: 110px; margin: 0 auto 20px; z-index: 2; }
    .big-avatar { width: 110px; height: 110px; border-radius: 35px; object-fit: cover; border: 3px solid var(--accent); background: var(--card-bg); }
    .edit-badge { position: absolute; bottom: -5px; right: -5px; background: var(--accent); color: white; width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--dark-bg); cursor: pointer; }
    
    .name-container { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
    .user-name-input { background: transparent; border: none; color: white; text-align: center; font-size: 24px; font-weight: 800; width: auto; outline: none; border-bottom: 1px dashed rgba(255,255,255,0.1); }
    .verified-tick { color: var(--accent); display: flex; align-items: center; }

    /* --- MAIN CONTENT --- */
    .main-content { padding: 0 20px; margin-top: -40px; position: relative; z-index: 5; }

    /* --- WITHDRAW CARD --- */
    .withdraw-card {
      background: linear-gradient(135deg, #007aff, #00c6ff);
      padding: 25px; border-radius: 30px; margin-bottom: 25px;
      box-shadow: 0 15px 35px rgba(0, 122, 255, 0.3);
    }
    .balance-val { font-size: 32px; font-weight: 900; margin: 5px 0 15px; }
    .btn-withdraw {
      background: #fff; color: var(--accent); border: none; padding: 12px 25px;
      border-radius: 15px; font-weight: 800; width: 100%; cursor: pointer;
    }

    /* --- HISTORY SECTION --- */
    .section-title { font-size: 16px; font-weight: 800; margin-bottom: 15px; color: #fff; display: flex; justify-content: space-between; }
    .history-list { background: var(--card-bg); border-radius: 28px; padding: 15px; border: 1px solid var(--glass); }
    .history-item { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .history-item:last-child { border: none; }
    .h-info { display: flex; flex-direction: column; gap: 4px; }
    .h-amount { font-weight: 800; font-size: 14px; }
    .h-date { font-size: 10px; color: var(--text-muted); }
    .status-badge { font-size: 10px; padding: 4px 10px; border-radius: 20px; font-weight: 800; text-transform: uppercase; }
    .status-pending { background: rgba(255, 204, 0, 0.1); color: var(--warning); }
    .status-paid { background: rgba(52, 199, 89, 0.1); color: var(--success); }

    /* --- MODAL --- */
    #withdrawModal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-content { background: var(--card-bg); padding: 30px; border-radius: 35px; width: 100%; max-width: 400px; border: 1px solid var(--glass); }
    .modal-input { width: 100%; background: #050a12; border: 1px solid #1e293b; padding: 15px; border-radius: 15px; color: white; margin: 15px 0; outline: none; }

    /* --- NAV --- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: rgba(5, 10, 18, 0.8);
      backdrop-filter: blur(25px); border-top: 1px solid var(--glass);
      display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px;
    }
    .nav-item { text-align: center; color: #4b5563; text-decoration: none; font-size: 10px; font-weight: 700; }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 24px; display: block; margin-bottom: 4px; }

    #toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 12px 28px; border-radius: 15px; font-weight: 700; display: none; z-index: 10000; }
  </style>
</head>
<body>

  <div id="toast">Request Sent! 💸</div>

  <div id="withdrawModal">
    <div class="modal-content">
      <h2 style="margin:0">Withdraw</h2>
      <p style="color: var(--text-muted); font-size: 13px;">Enter UPI ID</p>
      <input type="text" id="upiId" class="modal-input" placeholder="example@ybl">
      <button class="btn-withdraw" style="background: var(--accent); color: white;" onclick="submitWithdraw()">Submit Request</button>
      <button onclick="closeModal()" style="background:transparent; color: #ff3b30; border:none; width:100%; margin-top:15px; font-weight:700;">Cancel</button>
    </div>
  </div>

  <div class="profile-header">
    <div class="avatar-container">
      <img src="https://via.placeholder.com/110" class="big-avatar" id="profileImg">
      <label for="fileInput" class="edit-badge">📷</label>
      <input type="file" id="fileInput" accept="image/*" onchange="uploadImage(event)" hidden>
    </div>
    <div class="name-container">
      <input type="text" class="user-name-input" id="userName" value="Student Partner" onchange="syncToFirebase()">
      <div class="verified-tick"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M23 12l-2.44-2.79.34-3.69-3.61-.82-1.89-3.2L12 2.96 8.6 1.5 6.71 4.7l-3.61.81.34 3.7L1 12l2.44 2.79-.34 3.69 3.61.82 1.89 3.2L12 21.04l3.4 1.46 1.89-3.2 3.61-.82-.34-3.69L23 12zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z"/></svg></div>
    </div>
  </div>

  <div class="main-content">
    
    <div class="withdraw-card">
      <div style="font-size:12px; font-weight:700; opacity:0.9;">AVAILABLE BALANCE</div>
      <div class="balance-val">₹<span id="walletBal">0.00</span></div>
      <button class="btn-withdraw" onclick="openModal()">Withdraw Now</button>
    </div>

    <div class="section-title">Withdrawal History <span>🕒</span></div>
    <div class="history-list" id="historyList">
      <div style="text-align:center; font-size:12px; color:var(--text-muted); padding:10px;">No transactions yet</div>
    </div>

    <div style="margin-top:25px;" class="section-title">Account Details</div>
    <div class="history-list">
        <div class="history-item"><span style="color:var(--text-muted)">Partner ID</span><span style="font-weight:700">#BT-7008</span></div>
        <div class="history-item"><span style="color:var(--text-muted)">Status</span><span style="color:var(--success); font-weight:700">Verified</span></div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
    <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span>Profile</a>
    <a href="apply.html" class="nav-item"><span class="nav-icon">📝</span>Apply</a>
    <a href="contact.html" class="nav-item"><span class="nav-icon">📞</span>Help</a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, addDoc, collection, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3JnXAzxRGcoEgH4pO2ecAREYZrio_nZ8",
      authDomain: "nice-job-f79de.firebaseapp.com",
      projectId: "nice-job-f79de",
      storageBucket: "nice-job-f79de.firebasestorage.app",
      messagingSenderId: "116477324256",
      appId: "1:116477324256:web:4e9bee3627eb9f416d5985"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const userRef = "BTP-7008"; // Ye aap dynamic bhi kar sakte hain

    window.onload = () => {
      const earnings = localStorage.getItem('earnings') || "0.00";
      document.getElementById('walletBal').innerText = parseFloat(earnings).toFixed(2);
      document.getElementById('userName').value = localStorage.getItem('userName') || "Student Partner";
      if(localStorage.getItem('userImg')) document.getElementById('profileImg').src = localStorage.getItem('userImg');
      
      loadHistory();
    };

    // Load Live History from Firebase
    function loadHistory() {
      const q = query(collection(db, "withdrawals"), where("ref", "==", userRef), orderBy("date", "desc"));
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('historyList');
        if(snapshot.empty) return;
        container.innerHTML = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          const date = data.date.toDate().toLocaleDateString('en-IN', { day:'numeric', month:'short' });
          container.innerHTML += `
            <div class="history-item">
              <div class="h-info">
                <span class="h-amount">₹${parseFloat(data.amount).toFixed(2)}</span>
                <span class="h-date">${date} • UPI: ${data.upi}</span>
              </div>
              <span class="status-badge ${data.status === 'pending' ? 'status-pending' : 'status-paid'}">
                ${data.status}
              </span>
            </div>
          `;
        });
      });
    }

    window.openModal = () => {
      const bal = parseFloat(localStorage.getItem('earnings') || 0);
      if(bal < 100) { alert("Minimum withdraw ₹100 required!"); return; }
      document.getElementById('withdrawModal').style.display = 'flex';
    };

    window.closeModal = () => document.getElementById('withdrawModal').style.display = 'none';

    window.submitWithdraw = async () => {
      const upi = document.getElementById('upiId').value;
      const amount = localStorage.getItem('earnings');
      if(!upi.includes('@')) { alert("Invalid UPI ID"); return; }

      try {
        await addDoc(collection(db, "withdrawals"), {
          name: localStorage.getItem('userName'),
          upi, amount, ref: userRef, status: "pending", date: new Date()
        });
        showToast("Request Sent! 💸");
        closeModal();
      } catch (e) { console.error(e); }
    };

    window.syncToFirebase = async () => {
      const name = document.getElementById('userName').value;
      localStorage.setItem('userName', name);
      await setDoc(doc(db, "users", userRef), { name, lastActive: new Date() }, { merge: true });
      showToast("Profile Synced! ✨");
    };

    window.uploadImage = (e) => {
      const r = new FileReader();
      r.onload = () => { document.getElementById('profileImg').src = r.result; localStorage.setItem('userImg', r.result); };
      r.readAsDataURL(e.target.files[0]);
    };

    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }
  </script>
</body>
</html>
