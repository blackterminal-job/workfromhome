<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>My Profile | BlackTerminal</title>
  <style>
    :root {
      --accent: #007aff;
      --success: #34c759;
      --dark-bg: #050a12;
      --card-bg: #111827;
      --text-muted: #94a3b8;
    }

    body {
      margin: 0;
      font-family: -apple-system, system-ui, sans-serif;
      background-color: var(--dark-bg);
      color: #fff;
      padding-bottom: 90px;
    }

    /* --- PROFILE HEADER --- */
    .profile-header {
      background: linear-gradient(135deg, #007aff 0%, #00c6ff 100%);
      padding: 40px 20px;
      text-align: center;
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
      box-shadow: 0 10px 30px rgba(0, 122, 255, 0.3);
    }

    .big-avatar {
      width: 90px;
      height: 90px;
      background: #fff;
      color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      border: 4px solid rgba(255,255,255,0.2);
    }

    .user-name { font-size: 22px; font-weight: 800; margin: 0; }
    .user-role { font-size: 13px; opacity: 0.9; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

    .wrap { padding: 0 16px; margin-top: -30px; }

    /* --- STATS CARD --- */
    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .stat-val { font-size: 20px; font-weight: 800; display: block; }
    .stat-lab { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }

    /* --- ID CARD SECTION --- */
    .id-box {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .info-row:last-child { border: none; }
    .info-label { color: var(--text-muted); font-size: 13px; font-weight: 600; }
    .info-value { font-size: 13px; font-weight: 700; color: #f3f4f6; }

    .ref-code-box {
      background: rgba(0, 122, 255, 0.1);
      border: 1px dashed var(--accent);
      padding: 15px;
      border-radius: 16px;
      text-align: center;
      margin-top: 10px;
    }

    .btn-copy {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 800;
      width: 100%;
      margin-top: 10px;
      cursor: pointer;
    }

    /* --- BOTTOM NAV --- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05);
      display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: 10px;
    }
    .nav-item { text-align: center; color: #6b7280; text-decoration: none; font-size: 11px; font-weight: 700; }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 22px; display: block; margin-bottom: 4px; }

    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: var(--success); color: white; padding: 12px 24px; border-radius: 50px;
      font-weight: 700; font-size: 14px; display: none; z-index: 1000;
    }
  </style>
</head>
<body>

  <div id="toast">Code Copied! 📋</div>

  <div class="profile-header">
    <div class="big-avatar" id="userInitial">U</div>
    <h1 class="user-name">Student Partner</h1>
    <div class="user-role">Verified Referral Agent</div>
  </div>

  <div class="wrap">
    
    <div class="stats-container">
      <div class="stat-card">
        <span class="stat-val" id="totalEarned">₹0.00</span>
        <span class="stat-lab">Total Earned</span>
      </div>
      <div class="stat-card">
        <span class="stat-val" id="taskCount">0</span>
        <span class="stat-lab">Tasks Done</span>
      </div>
    </div>

    <div class="id-box">
      <h3 style="margin-top:0; font-size: 16px;">Identity Info</h3>
      
      <div class="info-row">
        <span class="info-label">Partner ID</span>
        <span class="info-value">#BT2026-001</span>
      </div>
      <div class="info-row">
        <span class="info-label">Join Date</span>
        <span class="info-value">Feb 2026</span>
      </div>
      <div class="info-row">
        <span class="info-label">Account Status</span>
        <span class="info-value" style="color: var(--success);">● Active</span>
      </div>

      <div class="ref-code-box">
        <div class="info-label" style="margin-bottom: 5px;">Your Referral Code</div>
        <div id="myCode" style="font-size: 24px; font-weight: 900; color: var(--accent); letter-spacing: 2px;">BTP-7008</div>
        <button class="btn-copy" onclick="copyRef()">Copy & Share Link</button>
      </div>
    </div>

    <a href="https://wa.me/917008186187?text=Hi, I want to update my profile details" 
       style="display: block; text-align: center; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600;">
       Edit Profile Details? Contact Admin
    </a>

  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
    <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span>Profile</a>
    <a href="apply.html" class="nav-item"><span class="nav-icon">📝</span>Apply</a>
    <a href="contact.html" class="nav-item"><span class="nav-icon">📞</span>Help</a>
  </nav>

  <script>
    // LocalStorage se data load karna
    window.onload = () => {
      const earnings = parseFloat(localStorage.getItem('earnings')) || 0;
      const tasks = parseInt(localStorage.getItem('taskCount')) || 0;
      
      document.getElementById('totalEarned').innerText = "₹" + earnings.toFixed(2);
      document.getElementById('taskCount').innerText = tasks;
    };

    function copyRef() {
      const code = document.getElementById('myCode').innerText;
      const shareText = `Join BlackTerminal Computer Institute using my code ${code} and get special discount!`;
      
      navigator.clipboard.writeText(shareText).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
      });
    }
  </script>
</body>
</html>
