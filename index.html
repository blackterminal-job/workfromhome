<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>Work Panel | BlackTerminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #007aff;
      --gold: #ffcc00;
      --success: #34c759;
      --dark-bg: #050a12;
      --card-bg: #111827;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--dark-bg); color: #fff; padding-bottom: 95px; }

    /* NOTICE BAR */
    .notice-bar { margin: 15px; background: rgba(0, 122, 255, 0.05); border: 1px solid rgba(0, 122, 255, 0.15); border-radius: 16px; padding: 10px; display: flex; align-items: center; overflow: hidden; }
    .tag { background: var(--accent); color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; margin-right: 10px; }
    marquee { font-size: 13px; font-weight: 600; color: var(--accent); }

    /* WALLET */
    .wallet-card { margin: 0 16px 15px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 22px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
    .wallet-balance { font-size: 38px; font-weight: 800; margin: 8px 0; display: flex; align-items: center; gap: 5px; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 10px; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: 1s ease; }

    /* HALL OF FAME */
    .leader-scroll { display: flex; gap: 12px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; margin-bottom: 5px; }
    .leader-scroll::-webkit-scrollbar { display: none; }
    .leader-card { background: var(--card-bg); padding: 16px; border-radius: 22px; min-width: 140px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }

    /* TASK CARDS */
    .task-card { margin: 0 16px 16px; background: var(--card-bg); border-radius: 24px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); position: relative; overflow: hidden; }
    .reward-tag { background: rgba(52, 199, 89, 0.1); color: var(--success); padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; }
    
    /* BUTTONS */
    .btn { width: 100%; padding: 16px; border-radius: 18px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-disabled { background: #374151 !important; color: #9ca3af !important; cursor: not-allowed; }

    /* LOCK OVERLAY */
    .lock-overlay { position: absolute; inset: 0; background: rgba(5, 10, 18, 0.85); backdrop-filter: blur(6px); border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 20px; }

    .section-title { padding: 0 20px; font-size: 18px; font-weight: 700; margin: 20px 0 15px; display: flex; align-items: center; gap: 8px; }
    .section-title span { width: 4px; height: 18px; background: var(--accent); border-radius: 10px; }
  </style>
</head>
<body>

  <div class="notice-bar">
    <span class="tag">NEWS</span>
    <marquee id="liveNotice" scrollamount="5">Connecting...</marquee>
  </div>

  <div class="wallet-card">
    <div style="font-size: 13px; color: #94a3b8; font-weight: 600;">EARNINGS</div>
    <div class="wallet-balance"><span style="font-size:22px; color:#94a3b8">₹</span><span id="totalEarn">0.00</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="section-title"><span></span> Hall of Fame</div>
  <div class="leader-scroll" id="leaderBoardContainer"></div>

  <div class="section-title"><span></span> Today's Task</div>
  <div class="task-card">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
      <div class="reward-tag">Small Task</div>
      <div style="font-weight:800; color:var(--success)" id="taskReward">₹0.00</div>
    </div>
    <div id="taskName" style="font-size:17px; font-weight:700; margin-bottom:12px;">Loading...</div>
    <div id="stepList" style="margin-bottom:20px;"></div>
    
    <button id="claimBtn" class="btn btn-primary" onclick="completeTask()">Claim Reward</button>
  </div>

  <div class="section-title"><span></span> Bonus Mission</div>
  <div class="task-card">
    <div id="bigLock" class="lock-overlay">
      <div style="font-size:35px;">🔒</div>
      <div id="lockText" style="font-weight:800; font-size:15px; color:var(--gold);">Mission Locked</div>
    </div>
    <div id="bonusName" style="font-size:17px; font-weight:700;">Loading Bonus...</div>
    <button class="btn" style="background:var(--gold); margin-top:20px; color:#000;" onclick="sendBonusProof()">Claim Bonus</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA3JnXAzxRGcoEgH4pO2ecAREYZrio_nZ8", projectId: "nice-job-f79de" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let earnings = parseFloat(localStorage.getItem('earnings')) || 0;
    let taskCount = parseInt(localStorage.getItem('taskCount')) || 0;
    let requiredTasks = 5;

    // --- TIMER LOGIC ---
    function startTimer() {
      const claimBtn = document.getElementById('claimBtn');
      const nextAvailable = localStorage.getItem('nextClaimTime');
      
      if (nextAvailable) {
        const diff = parseInt(nextAvailable) - Date.now();
        if (diff > 0) {
          claimBtn.disabled = true;
          claimBtn.classList.add('btn-disabled');
          
          const timerInterval = setInterval(() => {
            const timeLeft = parseInt(localStorage.getItem('nextClaimTime')) - Date.now();
            if (timeLeft <= 0) {
              clearInterval(timerInterval);
              claimBtn.disabled = false;
              claimBtn.classList.remove('btn-disabled');
              claimBtn.innerText = "Claim Reward";
            } else {
              const minutes = Math.floor((timeLeft / 1000 / 60) % 60);
              const seconds = Math.floor((timeLeft / 1000) % 60);
              claimBtn.innerText = `Next Task in ${minutes}m ${seconds}s`;
            }
          }, 1000);
        }
      }
    }

    window.completeTask = () => {
      const rewardVal = parseFloat(document.getElementById('taskReward').innerText.replace('₹', ''));
      earnings += rewardVal;
      taskCount++;
      
      // Save data
      localStorage.setItem('earnings', earnings);
      localStorage.setItem('taskCount', taskCount);
      
      // Set 1 Hour Timer (3600000 ms)
      const nextTime = Date.now() + 3600000;
      localStorage.setItem('nextClaimTime', nextTime);
      
      updateUI();
      startTimer();
      alert("Reward Claimed! Next task will unlock in 1 hour.");
    };

    // --- FIREBASE SYNC ---
    onSnapshot(doc(db, "settings", "dailyTask"), (d) => {
      if(d.exists()){
        const data = d.data();
        document.getElementById('taskName').innerText = data.name;
        document.getElementById('taskReward').innerText = "₹" + data.reward.toFixed(2);
        document.getElementById('stepList').innerHTML = data.steps.map((s,i) => `<div style="font-size:12px; color:#9ca3af; margin-bottom:5px;"><b>${i+1}.</b> ${s}</div>`).join('');
      }
    });

    onSnapshot(doc(db, "settings", "bonusReward"), (d) => {
      if(d.exists()){
        requiredTasks = d.data().lockCount;
        document.getElementById('bonusName').innerText = d.data().name;
        updateUI();
      }
    });

    onSnapshot(doc(db, "settings", "leaderboard"), (d) => {
      if(d.exists()){
        const container = document.getElementById('leaderBoardContainer');
        container.innerHTML = d.data().ranks.map((r,i) => {
          const [n, e] = r.split('-');
          return `<div class="leader-card"><div>${['🥇','🥈','🥉'][i] || '👤'}</div><div style="font-weight:800; font-size:13px;">${n}</div><div style="color:var(--gold); font-size:12px;">${e}</div></div>`;
        }).join('');
      }
    });

    window.updateUI = () => {
      document.getElementById('totalEarn').innerText = earnings.toFixed(2);
      let progress = (taskCount / requiredTasks) * 100;
      document.getElementById('progressFill').style.width = (progress > 100 ? 100 : progress) + "%";
      document.getElementById('bigLock').style.display = taskCount >= requiredTasks ? 'none' : 'flex';
      if(taskCount < requiredTasks) document.getElementById('lockText').innerText = `Complete ${requiredTasks - taskCount} more tasks`;
    };

    // Initialize
    updateUI();
    startTimer();
  </script>
</body>
</html>
